<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found &mdash; Ritika Das</title>
<meta name="description" content="That page doesn't exist. Here's the way back.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Inter:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=20260819s">
<script>
/* Same pre-paint theme read as every other page, so someone who chose dark
   doesn't get a flash of cream on the way to being told they took a wrong turn. */
(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
/* GitHub Pages serves this file for any path that does not exist, so it has to
   stand alone: absolute asset paths, no nav, and every link pointing home. */
.nf{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.nf-in{max-width:520px;text-align:left}
.nf-code{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nf h1{font-family:var(--display);font-weight:500;font-size:clamp(30px,5vw,44px);line-height:1.1;
  letter-spacing:-.03em;margin:14px 0 0;color:var(--ink)}
.nf p{margin:16px 0 0;font-size:16px;line-height:1.65;color:var(--ink-2);max-width:46ch}
.nf-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.nf-links a{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;min-height:44px;
  font-family:var(--mono);font-size:12.5px;border-radius:10px;text-decoration:none;
  border:1px solid var(--hairline-strong);color:var(--ink);transition:box-shadow .2s,border-color .2s}
.nf-links a.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.nf-links a:hover{box-shadow:var(--shadow-lift);border-color:var(--ink)}
.nf-links a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main class="nf">
  <div class="nf-in">
    <div class="nf-code">Error 404</div>
    <h1>This page doesn&rsquo;t exist.</h1>
    <p>Either the link was wrong, or something moved and I forgot to leave a forwarding address. Both are on me.</p>
    <div class="nf-links">
      <a class="primary" href="/">Back to the homepage</a>
      <a href="/writing/">Read the writing</a>
    </div>
  </div>
</main>
<!-- GoatCounter: privacy-first counts, no cookies, so no consent banner.
     ~3KB and async, to keep the page budget the site was tuned to. -->
<script data-goatcounter="https://ritikadas.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
