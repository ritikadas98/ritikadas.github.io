<svg viewBox="0 0 720 530" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The filter a power-user workaround runs through: if it is safe for creators and advertisers it is adopted or paywalled; if not, it is redesigned to be safe where possible; if neither, it is refused.">
  <!-- Same rule as the other diagram: site custom properties, so it follows the
       theme. Only works inlined, not through <img>. -->
  <defs>
    <marker id="dt-arrow" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--hairline-strong)"/>
    </marker>
    <marker id="dt-arrow-a" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <g stroke-width="1.6" fill="none">
    <!-- the spine: every "no" falls straight down -->
    <path d="M300 76 L300 112" stroke="var(--hairline-strong)" marker-end="url(#dt-arrow)"/>
    <path d="M300 236 L300 296" stroke="var(--hairline-strong)" marker-end="url(#dt-arrow)"/>
    <path d="M300 420 L300 458" stroke="var(--hairline-strong)" marker-end="url(#dt-arrow)"/>
    <!-- the two ways out, in accent -->
    <path d="M436 174 L508 174" stroke="var(--accent)" marker-end="url(#dt-arrow-a)"/>
    <path d="M436 358 L508 358" stroke="var(--accent)" marker-end="url(#dt-arrow-a)"/>
  </g>

  <g font-family="Inter, sans-serif">
    <!-- the signal arriving -->
    <rect x="170" y="12" width="260" height="64" rx="12"
          fill="var(--surface-2)" stroke="var(--hairline-strong)" stroke-width="1.5"/>
    <text x="300" y="50" text-anchor="middle" font-size="16.5" font-weight="600"
          fill="var(--ink)">Power-user workaround</text>

    <!-- first gate -->
    <path d="M300 112 L436 174 L300 236 L164 174 Z"
          fill="var(--surface-2)" stroke="var(--hairline-strong)" stroke-width="1.5"/>
    <text x="300" y="169" text-anchor="middle" font-size="14.5" font-weight="600" fill="var(--ink)">Safe for creators</text>
    <text x="300" y="189" text-anchor="middle" font-size="14.5" font-weight="600" fill="var(--ink)">&amp; advertisers?</text>

    <rect x="508" y="142" width="184" height="64" rx="12" fill="var(--accent)"/>
    <text x="600" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="var(--paper)">Adopt</text>
    <text x="600" y="190" text-anchor="middle" font-size="12.5" fill="var(--paper)" opacity=".8">or paywall it</text>

    <!-- second gate -->
    <path d="M300 296 L436 358 L300 420 L164 358 Z"
          fill="var(--surface-2)" stroke="var(--hairline-strong)" stroke-width="1.5"/>
    <text x="300" y="353" text-anchor="middle" font-size="14.5" font-weight="600" fill="var(--ink)">Can it be redesigned</text>
    <text x="300" y="373" text-anchor="middle" font-size="14.5" font-weight="600" fill="var(--ink)">to be safe?</text>

    <rect x="508" y="326" width="184" height="64" rx="12" fill="var(--accent)"/>
    <text x="600" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="var(--paper)">Re-architect</text>

    <!-- and the answer that stays no -->
    <rect x="196" y="458" width="208" height="62" rx="12"
          fill="none" stroke="var(--hairline-strong)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="300" y="484" text-anchor="middle" font-size="16" font-weight="600" fill="var(--ink)">Refuse</text>
    <text x="300" y="504" text-anchor="middle" font-size="12.5" fill="var(--muted)">and keep refusing</text>

    <!-- branch labels -->
    <g font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1"
       font-weight="500" fill="var(--muted)">
      <text x="466" y="166" text-anchor="middle">YES</text>
      <text x="466" y="350" text-anchor="middle">YES</text>
      <text x="316" y="272">NO</text>
      <text x="316" y="446">NO</text>
    </g>
  </g>
</svg>
