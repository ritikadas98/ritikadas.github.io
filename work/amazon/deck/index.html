<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amazon Discovery Intelligence &mdash; deck</title>
<meta name="description" content="Case study deck: a pipeline that reads a week of public Amazon reviews and names the one problem worth starting.">
<meta name="robots" content="noindex">
<link rel="icon" href="../../../favicon.ico" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
/* Amazon's palette, lifted from tools/og-card.py so the deck matches the card a
   reader already saw on the homepage. Every deck swaps these six values and
   nothing else. */
:root{
  --brand:#1F2937; --f0:#4A5A6B; --f1:#2C3A47; --f2:#1F2937; --f3:#0E141B;
  --accent:#FF9900; --paper:#EDE8E1; --card:#FFF; --ink:#211E24; --ink2:#4A4550;
  --muted:#8A8188; --line:rgba(33,30,36,.12);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-font-smoothing:antialiased}

/* Slides are stacked and swapped, never scrolled. A deck that scrolls is a page,
   and the difference is whether one idea is ever alone on the screen. */
#stage{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{position:absolute;inset:0;padding:clamp(28px,4.4vw,76px);display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:translateY(22px);
  transition:opacity .5s var(--ease),transform .5s var(--ease),visibility 0s .5s}
.slide.on{opacity:1;visibility:visible;transform:none;
  transition:opacity .5s var(--ease),transform .5s var(--ease),visibility 0s}
.slide.past{transform:translateY(-22px)}
.slide.dark{background:var(--f2);color:#fff}
.slide.grad{background:linear-gradient(135deg,var(--f0) 0%,var(--f2) 55%,var(--f3) 100%);color:#fff}
.slide.mid{justify-content:center}
.body{flex:1;display:flex;flex-direction:column;min-height:0;justify-content:center;
  padding-bottom:clamp(26px,5vh,58px)}
.body>*{width:100%;flex:1 1 auto}

.pill{display:inline-block;align-self:flex-start;background:var(--brand);color:#fff;
  font:500 11px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;
  padding:9px 16px;border-radius:99px;margin-bottom:clamp(16px,2.6vh,34px)}
.grad .pill,.dark .pill{background:rgba(255,255,255,.14)}
h1{font:800 clamp(34px,5.4vw,66px)/1.06 var(--display);letter-spacing:-.025em}
h2{font:700 clamp(23px,3.2vw,42px)/1.13 var(--display);letter-spacing:-.018em;max-width:20ch}
h2.wide{max-width:28ch}
.big-say{font:700 clamp(26px,4.1vw,54px)/1.1 var(--display);letter-spacing:-.024em;max-width:24ch}
.hi{font-style:normal;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.lead{font-size:clamp(13.5px,1.22vw,17.5px);line-height:1.55;color:var(--ink2);max-width:64ch;
  margin-top:clamp(9px,1.5vh,17px)}
.dark .lead,.grad .lead{color:#C6CDD4}
.src{position:absolute;left:clamp(28px,4.4vw,76px);bottom:clamp(18px,2.6vh,30px);
  font-size:11.5px;color:var(--muted)}
.dark .src,.grad .src{color:#8899A6}
.src a{color:inherit}

.slide.on .r{animation:rise .55s var(--ease) both}
.r{opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.grid{display:grid;gap:clamp(10px,1.05vw,16px);margin-top:clamp(14px,2.4vh,30px);
  align-content:center;max-height:100%}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid transparent;border-radius:14px;
  padding:clamp(19px,1.8vw,29px);
  transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease)}
.card:hover{transform:translateY(-5px);border-color:var(--brand);
  box-shadow:0 14px 34px -18px rgba(31,41,55,.55)}
.card h3{font:700 clamp(15px,1.28vw,19px)/1.25 var(--display);color:var(--brand);margin-bottom:11px;
  padding-top:13px;border-top:3px solid var(--accent);display:inline-block}
.card p{font-size:clamp(12.5px,1.04vw,15px);line-height:1.62;color:var(--ink2)}
.card .k{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:9px}
.card .big{font:800 clamp(25px,2.6vw,38px)/1 var(--display);color:var(--brand);letter-spacing:-.025em;
  display:block;margin-bottom:7px}
.dark .card,.grad .card{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.13)}
.dark .card h3,.grad .card h3,.dark .card .big,.grad .card .big{color:var(--accent)}
.dark .card p,.grad .card p{color:#C6CDD4}
.dark .card:hover,.grad .card:hover{background:rgba(255,255,255,.13);border-color:var(--accent)}

.rows{margin-top:clamp(14px,2.2vh,28px);display:flex;flex-direction:column;gap:clamp(7px,1.2vh,12px)}
.rows{max-height:100%;justify-content:center}
.rows .row{flex:1 1 auto;max-height:100px}
.row{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;
  background:var(--card);border-radius:12px;padding:clamp(12px,1.25vw,19px) clamp(14px,1.3vw,22px);
  border:1px solid transparent;
  transition:transform .26s var(--ease),border-color .26s var(--ease)}
.row:hover{transform:translateX(6px);border-color:var(--brand)}
.row.plain{grid-template-columns:1fr;gap:0;border-left:4px solid var(--f0)}
.row.plain:hover{border-left-color:var(--accent)}
.row .n{font:500 11px/1 var(--mono);color:#fff;background:var(--f0);width:32px;height:32px;
  border-radius:50%;display:grid;place-items:center}
.row.hot{background:var(--brand)} .row.hot .n{background:var(--accent);color:var(--brand)}
.row.hot b{color:#fff} .row.hot span{color:#D6DEE4}
.row .t{display:grid;grid-template-columns:minmax(84px,142px) 1fr;gap:16px;align-items:baseline}
.row b{font:700 clamp(13px,1.1vw,16px)/1.3 var(--display)}
.row span{font-size:clamp(12px,1vw,14.5px);line-height:1.45;color:var(--ink2)}

.bars{max-height:100%;display:flex;flex-direction:column;justify-content:center;
  gap:clamp(12px,2.4vh,26px);margin-top:clamp(14px,2.2vh,28px)}
.bar{display:grid;grid-template-columns:minmax(112px,182px) 1fr 46px;gap:14px;align-items:center;
  font-size:clamp(12px,1vw,14.5px);cursor:default}
.bar .track{background:rgba(31,41,55,.09);border-radius:7px;height:clamp(20px,3vh,32px);overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--brand);border-radius:6px;width:0;
  transition:width .9s var(--ease),background .25s}
.on .bar .fill{width:var(--w)}
.bar:hover .fill{background:var(--accent)}
.bar .v{font:500 13px/1 var(--mono);color:var(--muted);text-align:right;transition:color .25s}
.bar:hover .v{color:var(--brand)}

.funnel{display:flex;gap:clamp(8px,1vw,16px);align-items:stretch;margin-top:clamp(16px,2.6vh,32px);
  max-height:100%;align-items:center}
.step{flex:1;background:var(--card);border-radius:14px;padding:clamp(17px,1.75vw,27px);
  border:1px solid transparent;position:relative;
  transition:transform .28s var(--ease),border-color .28s var(--ease),box-shadow .28s var(--ease)}
.step:hover{transform:translateY(-6px);border-color:var(--brand);
  box-shadow:0 14px 34px -18px rgba(31,41,55,.55)}
.step .k{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.step .big{font:800 clamp(34px,4vw,64px)/1 var(--display);color:var(--brand);
  letter-spacing:-.03em;margin:12px 0 8px}
.step:last-child .big{color:var(--accent)}
.step p{font-size:clamp(12px,1vw,14.5px);line-height:1.5;color:var(--ink2)}
.step::after{content:"";position:absolute;right:-13px;top:50%;width:7px;height:7px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:translateY(-50%) rotate(-45deg)}
.step:last-child::after{display:none}

.split2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.4vw,22px);
  margin-top:clamp(16px,2.6vh,32px);max-height:100%;align-items:center}
.panel{border-radius:14px;padding:clamp(17px,1.75vw,27px);transition:transform .28s var(--ease)}
.panel:hover{transform:translateY(-5px)}
.panel.was{background:#8C8A88;color:#fff} .panel.now{background:var(--brand);color:#fff}
.panel .k{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.82}
.panel .big{font:800 clamp(28px,3.2vw,48px)/1.04 var(--display);margin:12px 0 10px;letter-spacing:-.022em}
.panel p{font-size:clamp(12.5px,1.04vw,15px);line-height:1.6;opacity:.93}

#bar{position:fixed;left:0;top:0;height:3px;background:var(--accent);width:0;z-index:40;
  transition:width .45s var(--ease)}
#nav{position:fixed;right:clamp(16px,2.2vw,32px);bottom:clamp(14px,2vh,26px);
  display:flex;gap:8px;align-items:center;z-index:40}
#nav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.85);color:var(--ink);cursor:pointer;font-size:15px;
  display:grid;place-items:center;transition:background .2s,transform .2s,border-color .2s,color .2s}
#nav button:hover:not(:disabled){background:var(--brand);color:#fff;border-color:var(--brand);
  transform:translateY(-2px)}
#nav button:disabled{opacity:.3;cursor:default}
#count{font:500 12px/1 var(--mono);color:var(--muted);min-width:46px;text-align:center}
body.on-dark #nav button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
body.on-dark #count{color:#93A0AC}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:clamp(14px,2vh,26px);
  font:500 10.5px/1 var(--mono);letter-spacing:.08em;color:var(--muted);z-index:40;transition:opacity .4s}
body.moved #hint{opacity:0}
body.on-dark #hint{color:#7D8A96}

@media(max-width:880px){
  .g4,.g3{grid-template-columns:repeat(2,1fr)}
  .funnel{flex-wrap:wrap} .step{flex:1 1 44%} .step::after{display:none}
  .split2{grid-template-columns:1fr}
  .row .t{grid-template-columns:1fr;gap:3px}
  .bar{grid-template-columns:minmax(84px,116px) 1fr 42px}
  h2{max-width:none}
}
@media(prefers-reduced-motion:reduce){
  .slide,.card,.row,.step,.panel,.bar .fill,#bar{transition:none!important;animation:none!important}
  .r{opacity:1}
}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="hint">&larr; &rarr; to move</div>
<nav id="nav">
  <button id="prev" type="button" aria-label="Previous slide">&larr;</button>
  <span id="count">1 / 1</span>
  <button id="next" type="button" aria-label="Next slide">&rarr;</button>
</nav>
<script src="deck.js"></script>
</body>
</html>
