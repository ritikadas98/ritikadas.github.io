<style>
/* Savio's palette, lifted from tools/og-card.py so the deck matches the card a
   reader already saw on the homepage. The sage green is Savio's; the accent is
   the coral that opens its own icon gradient, deepened until it is legible on
   paper. This block is the only thing that makes this deck look like this deck. */
:root{
  --brand:#2F5D50; --f0:#4E8C77; --f1:#2F5D50; --f2:#1E3F36; --f3:#0F221D;
  --accent:#E2685E; --paper:#EDE8E1; --card:#FFF; --ink:#211E24; --ink2:#4A4550;
  --muted:#8A8188; --line:rgba(33,30,36,.12);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}

/* ---- cover art: one month, thirty days ----
   Twenty-seven of them Savio says nothing. It speaks on payday, when a windfall
   lands, and a few days after a purchase. The gap in the middle is the checkout,
   which every other budgeting app aims at and this one skips on purpose. */
/* ---- the cover: text on the left, the month beside it ----
   Stacked, the cover put its text at the top and its art at the bottom with a
   dead band between them and the whole right half empty. The other covers in
   the set are two-column — Reddit sets its thread screenshot beside the title
   — so this one is too.

   Centred with top/bottom/margin rather than translateY(-50%). Chrome
   rasterises a transformed subtree separately when printing, which puts the
   art at the wrong scale inside a correctly sized frame. The shared print
   block already forces transform:none on .slide for the same reason. */
.slide.grad .pill,.slide.grad h1,.slide.grad .lead,.verdict{max-width:min(52%,470px)}

/* ---- the verdict card ----
   The sentence the product exists to produce, with the rupee figure it turns
   on. Directly under the lead, so the left column is one block — title, claim,
   the number — against the month on the right. Pushed to the foot instead it
   left a dead band across the middle of the slide. */
.verdict{margin-top:clamp(20px,3.4vh,38px);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  border-radius:14px;padding:clamp(15px,1.5vw,22px) clamp(17px,1.7vw,26px)}
.verdict .vk{font:500 10px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;
  color:#9DBBB0;display:block;margin-bottom:clamp(9px,1.3vh,14px)}
.vline{font:700 clamp(19px,2vw,30px)/1.2 var(--display);letter-spacing:-.018em;color:#fff}
/* Tabular figures so the amount does not wobble against the rest of the type. */
.vline b{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
.vsub{font:400 clamp(11px,.95vw,13.5px)/1.45 var(--body);color:#9DBBB0;
  margin-top:clamp(6px,.9vh,10px)}
.vsub span{color:#C9D9D2;font-variant-numeric:tabular-nums}
/* Centred in the right column, opposite the text column, so the cover reads as
   two columns rather than as blocks scattered around an empty middle.
   Centred with top/bottom/margin rather than translateY(-50%): Chrome
   rasterises a transformed subtree separately when printing, which puts the
   art at the wrong scale inside a correctly sized frame. */
.month{position:absolute;right:clamp(28px,4.4vw,76px);top:0;bottom:0;
  height:fit-content;margin-top:auto;margin-bottom:auto;width:min(36%,400px)}
/* Thirty days laid out as one row of thirty made each square about a fortieth
   of the slide, so the art was a hairline across the bottom and the cover was
   mostly empty field. Ten across is a calendar rather than a timeline — still
   one month, still thirty days, and it reads as a month faster. The width is
   capped so the squares stay squares and do not become panels. */
/* Six across, five down. Ten across made a wide, shallow band that left the
   right-hand column mostly empty field; six makes a block roughly as tall as
   the text column beside it, which is what closes the hole in the middle of
   the cover. Still thirty days, still one month. */
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(5px,.6vw,10px)}
.day{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.17);opacity:0;
  animation:dotin .5s var(--ease) both;animation-delay:var(--d)}
.day.speak{background:var(--accent);
  box-shadow:0 0 0 2px rgba(226,104,94,.28),0 0 20px 6px rgba(226,104,94,.42);
  animation:dotin .5s var(--ease) both,glow 2.4s var(--ease) 1.6s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px rgba(226,104,94,.28),0 0 20px 6px rgba(226,104,94,.42)}
  50%{box-shadow:0 0 0 3px rgba(226,104,94,.42),0 0 28px 10px rgba(226,104,94,.62)}}
.daykey{display:flex;gap:clamp(14px,1.8vw,30px);margin-top:clamp(11px,1.7vh,20px);flex-wrap:wrap}
.daykey span{font:500 10.5px/1.4 var(--mono);letter-spacing:.07em;color:#9DBBB0;
  display:flex;align-items:center;gap:8px}
.daykey i{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.17);display:block}
.daykey span:nth-child(2) i{background:var(--accent)}
.daykey span:nth-child(3){color:#7E9A90}
/* On a phone the strip becomes three rows of ten, because thirty cells across a
   358px frame are 18px wide and a quiet day at that size disappears. */
/* Two faces side by side do not survive a landscape crop on a narrow card, and
   the card is full width on a phone anyway, so the photo stays square and shows
   the whole frame. */
@media(max-width:880px){.pphoto{aspect-ratio:1}}
@media(max-width:880px){
  /* Absolute placement has nothing to sit beside on a narrow frame, so the
     month returns to the flow under the text it belongs to. */
  .slide.grad .pill,.slide.grad h1,.slide.grad .lead,.verdict{max-width:none}
  .month{position:static;width:auto;margin:clamp(14px,2.4vh,24px) 0 0}
  .verdict{margin:clamp(14px,2.4vh,22px) 0 0}
  .days{grid-template-columns:repeat(10,1fr);max-width:100%}
  .day{background:rgba(255,255,255,.24)}}
</style>
